<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNook - Browse & Discover</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/shelf.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/book-details.css">
</head>
<body>
    <header class="library-header">
        <div class="brand-block">
            <div class="brand-mark" aria-hidden="true">▣</div>
            <div class="brand-copy">
                <h1>The Curator's Shelf</h1>
                <p>A personal library</p>
            </div>
        </div>

        <label class="search-bar" aria-label="Search the collection">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search" placeholder="Search the collection" aria-label="Search the collection">
        </label>

        <div class="library-meta">✦ EST. 1897</div>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <main>
        <div class="shelf-wrapper">
            <div id="book-list" aria-label="Book shelf"></div>
        </div>
    </main>

    <div id="detail-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-overlay" data-close="true"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="close-modal" type="button" aria-label="Close book details">×</button>
            <div class="cover-frame">
                <img id="modal-cover" src="" alt="">
                <div id="modal-cover-fallback" class="cover-fallback" hidden aria-hidden="true">
                    <span class="cover-fallback-label">From the collection</span>
                    <span id="modal-cover-title"></span>
                </div>
            </div>
            <div class="modal-copy">
                <p id="modal-category" class="modal-category"></p>
                <h2 id="modal-title"></h2>
                <p id="modal-author"></p>
                <p id="modal-price"></p>
                <p id="modal-description"></p>
            </div>
            <div class="book-insights">
                <section class="insight-section">
                    <div class="insight-heading">
                        <div>
                            <p class="insight-eyebrow">For the mood</p>
                            <h3 id="modal-tropes-heading">Tropes &amp; themes</h3>
                        </div>
                    </div>
                    <div id="modal-tropes" class="trope-list"></div>
                </section>
                <section class="insight-section review-section">
                    <div class="insight-heading">
                        <div>
                            <p class="insight-eyebrow">Reader corner</p>
                            <h3>Reader notes</h3>
                        </div>
                        <a id="goodreads-link" class="goodreads-link" target="_blank" rel="noopener noreferrer">Find reviews on Goodreads <span aria-hidden="true">↗</span></a>
                    </div>
                    <p class="sample-disclaimer">Original sample notes for this demo — not Goodreads excerpts.</p>
                    <div id="modal-reviews" class="review-list"></div>
                </section>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
